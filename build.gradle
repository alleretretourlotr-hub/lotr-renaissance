buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'

version = mod_version
group = mod_group
archivesBaseName = 'lotr-alleretretour'

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

minecraft {
    // Mappings officielles Mojang (MojMap) - comme SaroumaneBoss
    mappings channel: 'official', version: minecraft_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { lotr { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.console.level', 'debug'
            mods { lotr { source sourceSets.main } }
        }
        data {
            workingDirectory project.file('run')
            args '--mod', 'lotr', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods { lotr { source sourceSets.main } }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "lotr",
            "Specification-Vendor"    : "AllerEtRetour",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : "AllerEtRetour"
        ])
    }
}

// Encodage : sources UTF-8 mais chaines ASCII only par convention (compat CP1252)
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
